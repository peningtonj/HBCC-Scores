<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Cricket Matches</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #13213C;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
    }
    .matches {
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 700px) {
      .matches { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1100px) {
      .matches { grid-template-columns: repeat(3, 1fr); }
    }
    .match-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }
    .round-badge {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9em;
      font-weight: 600;
    }
    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      color: white;
    }
    .status-live { background: #f59e0b; }
    .status-stumps { background: #6366f1; }
    .status-completed { background: #10b981; }
    .status-upcoming { background: #3b82f6; }
    .status-abandoned { background: #ef4444; }

    .teams { display: grid; gap: 15px; margin: 20px 0; }
    .team {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #f9fafb;
      border-radius: 10px;
      border-left: 4px solid transparent;
    }
    .team.winner {
      border-left-color: #10b981;
      background: #f0fdf4;
    }
    .team-logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }
    .team-name { font-weight: 600; }
    .team-score {
      font-size: 1.6em;
      font-weight: bold;
      color: #667eea;
    }
    .match-result {
      background: #f0f9ff;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      color: #0369a1;
      margin-top: 15px;
    }
    .venue-info {
      color: #6b7280;
      font-size: 0.9em;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
    }
    .loading {
      text-align: center;
      color: white;
      font-size: 1.5em;
      padding: 50px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1 id="title"></h1>
  <div class="matches" id="matches"></div>
  <div class="loading" id="loading">Loading matches...</div>
</div>

<script>
  let allMatches = [];
  let refreshInterval = null;

  let organisationId = null;
  let seasonId = null;
  let clubName = 'HBCC';
  let logoPath = 'hbcc.avif';

  const STATUS_ORDER = {
    "LIVE": 0,
    "STUMPS": 1
  };

  function statusRank(status) {
    return STATUS_ORDER[status] ?? 2;
  }

  function getMatchTime(m) {
    const tryList = [
      m.startDateTime,
      m.matchSchedule?.[0]?.startDateTime,
      m.detail?.matchSchedule?.[0]?.startDateTime,
      m.detail?.innings?.[0]?.startDateTime
    ];
    for (const v of tryList) {
      if (v) return Date.parse(v);
    }
    return 0;
  }

  function sortMatches(matches) {
    matches.sort((a, b) => {
      const statusDiff = statusRank(a.status) - statusRank(b.status);
      if (statusDiff !== 0) return statusDiff;
      return getMatchTime(b) - getMatchTime(a);
    });
  }

  function renderRecentMatches(matches) {
    document.getElementById('matches').innerHTML = matches.map(match => {
      const cp = match.currentPlayers || {};

      const strikerDisplay = cp.strikerName
        ? `${cp.strikerName} ${cp.strikerRuns ?? '-'} (${cp.strikerBalls ?? '-'})`
        : '-';

      const nonStrikerDisplay = cp.nonStrikerName
        ? `${cp.nonStrikerName} ${cp.nonStrikerRuns ?? '-'} (${cp.nonStrikerBalls ?? '-'})`
        : '-';

      let bowlerDisplay = '-';
      if (cp.bowlerName) {
        bowlerDisplay =
          `${cp.bowlerName} ${cp.bowlerOvers ?? '-'}-${cp.bowlerMaidens ?? '0'}-${cp.bowlerRunsConceded ?? '-'}-${cp.bowlerWickets ?? '-'}`;
      }

      return `
        <a href="https://play.cricket.com.au/match/${match.id}?tab=scorecard"
           target="_blank" style="text-decoration:none;color:inherit;">
          <div class="match-card">
            <div class="match-header">
              <div>
                <span class="round-badge">${match.round?.name || ''}</span>
                <div style="font-size:0.9em;color:#6b7280;">
                  ${new Date(getMatchTime(match)).toLocaleString()}
                </div>
              </div>
              <span class="status-badge status-${match.status.toLowerCase()}">
                ${match.status}
              </span>
            </div>

            <div class="current-players" style="margin-bottom:12px;font-weight:600;">
              <div>Batters: ${strikerDisplay}, ${nonStrikerDisplay}</div>
              <div>Bowler: ${bowlerDisplay}</div>
            </div>

            <div class="teams">
              ${match.teams.map(team => `
                <div class="team ${team.isWinner ? 'winner' : ''}">
                  <img src="${team.owningOrganisation.logoUrl}" class="team-logo"
                       onerror="this.style.display='none'">
                  <div class="team-name">${team.displayName}</div>
                  <div class="team-score">
                    ${(team.scoreText || '-')}${team.oversBowled ? ` (${team.oversBowled})` : ''}
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="match-result">${match.resultText || ''}</div>

            <div class="venue-info">
              📍 ${match.venue?.name || ''}, ${match.venue?.suburb || ''}
            </div>
          </div>
        </a>
      `;
    }).join('');
  }

  async function init() {
    document.getElementById('loading').style.display = 'none';
    sortMatches(allMatches);
    renderRecentMatches(allMatches);
  }

  init();
</script>
</body>
</html>
