<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Cricket Matches</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #13213C;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .matches {
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 700px) {
      .matches { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1100px) {
      .matches { grid-template-columns: repeat(3, 1fr); }
    }
    .match-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .round-badge {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9em;
      font-weight: 600;
    }
    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
    }
    .status-completed { background: #10b981; color: white; }
    .status-upcoming { background: #3b82f6; color: white; }
    .status-abandoned { background: #ef4444; color: white; }
    .status-live {
      background: #f59e0b;
      color: white;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .teams { display: grid; gap: 15px; margin: 20px 0; }
    .team {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #f9fafb;
      border-radius: 10px;
      border-left: 4px solid transparent;
    }
    .team.winner {
      border-left-color: #10b981;
      background: #f0fdf4;
    }
    .team-logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }
    .team-info { flex: 1; }
    .team-name { font-weight: 600; color: #1f2937; margin-bottom: 4px; }
    .team-score {
      font-size: 1.8em;
      font-weight: bold;
      color: #667eea;
    }
    .match-result {
      background: #f0f9ff;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      color: #0369a1;
      margin-top: 15px;
    }
    .venue-info {
      color: #6b7280;
      font-size: 0.9em;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
    }
    .loading {
      text-align: center;
      color: white;
      font-size: 1.5em;
      padding: 50px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1 id="title"></h1>
  <div class="stats" id="stats"></div>
  <div class="matches" id="matches"></div>
  <div class="loading" id="loading">Loading matches...</div>
</div>

<script>
  let allMatches = [];
  let refreshInterval = null;

  let organisationId = null;
  let seasonId = null;
  let clubName = 'HBCC';
  let logoPath = 'hbcc.avif';

  const STATUS_ORDER = {
    "LIVE": 0,
    "IN_PROGRESS": 1,
    "STUMPS": 2
  };

  function statusRank(status) {
    return STATUS_ORDER[status] ?? 100; // OTHER
  }

  function getMatchTime(m) {
    const tryList = [
      m.startDateTime,
      m.matchSchedule?.[0]?.startDateTime,
      m.detail?.matchSchedule?.[0]?.startDateTime,
      m.detail?.innings?.[0]?.startDateTime
    ];
    for (const v of tryList) {
      if (v) return Date.parse(v);
    }
    return 0;
  }

  function sortMatches(matches) {
    matches.sort((a, b) => {
      const statusDiff = statusRank(a.status) - statusRank(b.status);
      if (statusDiff !== 0) return statusDiff;
      return getMatchTime(b) - getMatchTime(a);
    });
  }

  async function loadConfig() {
    try {
      const res = await fetch('/config', { cache: 'no-store' });
      const cfg = await res.json();
      organisationId = cfg.organisationId || organisationId;
      seasonId = cfg.seasonId || seasonId;
      clubName = cfg.clubName || clubName;
      logoPath = cfg.logoPath || logoPath;
    } catch {}
  }

  function renderTitle() {
    const titleEl = document.getElementById('title');
    titleEl.innerHTML = `
      <img src="${logoPath}" style="width:48px;height:48px;vertical-align:middle;margin-right:12px;border-radius:6px;">
      ${clubName} Matches
    `;
  }

  function isMatchActuallyLive(match) {
    const STALE_THRESHOLD_MS = 4 * 60 * 60 * 1000;
    const lastBallTime =
      match.currentPlayers?.lastBallTime ||
      match.detail?.lastBallTime ||
      match.lastUpdated;

    if (!lastBallTime) return true;
    return (Date.now() - Date.parse(lastBallTime)) <= STALE_THRESHOLD_MS;
  }

  function startAutoRefresh(livePairs) {
    if (!livePairs.length) return;

    if (refreshInterval) clearInterval(refreshInterval);

    const checkAndRefresh = async () => {
      const refreshed = await Promise.all(
        livePairs.map(async ({ gradeId, teamId, gradeName }) => {
          const res = await fetch(`/api/matches?gradeId=${gradeId}&teamId=${teamId}`);
          const data = await res.json();
          return data.matches.length
            ? { ...data.matches[0], gradeId, teamId, gradeName }
            : null;
        })
      );

      refreshed.filter(Boolean).forEach(m => {
        const idx = allMatches.findIndex(x => x.id === m.id);
        if (idx !== -1) allMatches[idx] = m;
      });

      sortMatches(allMatches);
      renderRecentMatches(allMatches);

      if (!allMatches.some(m => m.status === 'LIVE' && isMatchActuallyLive(m))) {
        clearInterval(refreshInterval);
        refreshInterval = null;
      }
    };

    checkAndRefresh();
    refreshInterval = setInterval(checkAndRefresh, 10000);
  }

  async function init() {
    await loadConfig();
    renderTitle();

    const teamsRes = await fetch(
      `https://grassrootsapiproxy.cricket.com.au/fixturesladders/organisations/${organisationId}/teams?seasonId=${seasonId}&jsconfig=eccn%3Atrue`
    );
    const teamsData = await teamsRes.json();

    const pairs = (teamsData.teams || [])
      .map(t => ({
        gradeId: t.grade?.id || t.grades?.[0]?.id,
        teamId: t.id,
        gradeName: t.grade?.name || t.grades?.[0]?.name
      }))
      .filter(p => p.gradeId && p.teamId);

    const matches = (await Promise.all(
      pairs.map(async p => {
        const res = await fetch(`/api/matches?gradeId=${p.gradeId}&teamId=${p.teamId}`);
        const data = await res.json();
        return data.matches.length ? { ...data.matches[0], ...p } : null;
      })
    )).filter(Boolean);

    sortMatches(matches);

    allMatches = matches;
    document.getElementById('loading').style.display = 'none';
    renderRecentMatches(matches);

    startAutoRefresh(
      matches
        .filter(m => m.status === 'LIVE' && isMatchActuallyLive(m))
        .map(m => ({ gradeId: m.gradeId, teamId: m.teamId, gradeName: m.gradeName }))
    );
  }

  function renderRecentMatches(matches) {
    document.getElementById('matches').innerHTML = matches.map(match => `
      <a href="https://play.cricket.com.au/match/${match.id}?tab=scorecard"
         target="_blank" rel="noopener noreferrer"
         style="text-decoration:none;color:inherit;">
        <div class="match-card">
          <div class="match-header">
            <div>
              <span class="round-badge">${match.round?.name || ''}</span>
              <div style="color:#6b7280;font-size:0.9em;">
                ${new Date(getMatchTime(match)).toLocaleString()}
              </div>
            </div>
            <span class="status-badge status-${match.status.toLowerCase()}">
              ${match.status}
            </span>
          </div>

          <div class="teams">
            ${match.teams.map(team => `
              <div class="team ${team.isWinner ? 'winner' : ''}">
                <img src="${team.owningOrganisation.logoUrl}" class="team-logo"
                     onerror="this.style.display='none'">
                <div class="team-info">
                  <div class="team-name">${team.displayName}</div>
                </div>
                <div class="team-score">
                  ${(team.scoreText || '-')}${team.oversBowled ? ` (${team.oversBowled})` : ''}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="match-result">${match.resultText || ''}</div>
          <div class="venue-info">
            📍 ${match.venue?.name || ''}, ${match.venue?.suburb || ''}
          </div>
        </div>
      </a>
    `).join('');
  }

  init();
</script>
</body>
</html>
